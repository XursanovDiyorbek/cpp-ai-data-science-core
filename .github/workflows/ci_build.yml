name: C++ checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Compile with strict warnings
      run: g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -Iinclude src/matrix.cpp tests/matrix_tests.cpp -o matrix_tests

    - name: Run matrix tests
      run: ./matrix_tests
